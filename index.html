<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="CRM Platform — lightweight customer relationship management." />
  <title>CRM Platform</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark">C</span><span>CRM Platform</span></div>
    <nav>
      <button class="nav-item active" data-view="dashboard">Dashboard</button>
      <button class="nav-item" data-view="search">Global Search</button>
      <button class="nav-item" data-view="contacts">Contacts</button>
      <button class="nav-item" data-view="companies">Companies</button>
      <button class="nav-item" data-view="leads">Leads</button>
      <button class="nav-item" data-view="deals">Deals</button>
      <button class="nav-item" data-view="tasks">Tasks</button>
    </nav>
    <div class="sidebar-footer">Public beta · v0.9</div>
  </aside>
  <main class="main">
    <header class="topbar"><div><p class="eyebrow">CUSTOMER RELATIONSHIP MANAGEMENT</p><h1 id="page-title">Dashboard</h1></div><button id="reset-demo" class="ghost-btn">Reset demo data</button></header>
    <section id="app" class="content"></section>
  </main>
  <div id="modal" class="modal hidden" aria-hidden="true"><div class="modal-card"><button id="close-modal" class="modal-close" aria-label="Close">×</button><h2 id="modal-title">Add record</h2><form id="record-form"></form></div></div>
  <div id="company-detail-modal" class="modal hidden" aria-hidden="true"><div class="modal-card company-detail-modal-card"><button id="close-company-detail" class="modal-close" aria-label="Close">×</button><div id="company-detail"></div></div></div>
  <script src="app.js"></script>
  <script src="leads.js"></script>
  <script src="deals.js"></script>
  <script src="tasks.js"></script>
  <script src="search.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
